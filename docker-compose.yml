services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devmind
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind
    ports:
      - "5432:5432"
    volumes:
      - devmind-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  devmind-data:
